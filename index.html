<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>깐죽이</title>
<meta name="description" content="장난기 많고 짓궂은 AI 챗봇, 깐죽이" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#FF7A59" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="깐죽이" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; justify-content: center; align-items: center;
    padding: 16px;
    background: radial-gradient(circle at 30% 20%, #FFEFC2 0%, #FFD9A0 60%, #FFC074 100%);
    font-family: 'Gaegu', sans-serif;
  }
  @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes wiggle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  @keyframes dots { 0%,20% { opacity: 0.2; } 50% { opacity: 1; } 80%,100% { opacity: 0.2; } }
  .jb-msg { animation: pop 0.22s ease-out; }
  .jb-face { animation: wiggle 2.4s ease-in-out infinite; }
  .jb-eye { animation: blink 4s infinite; transform-origin: center; }
  .jb-send:active { transform: translateY(2px) scale(0.96); }
  .jb-d1 { animation: dots 1.2s infinite; }
  .jb-d2 { animation: dots 1.2s infinite 0.2s; }
  .jb-d3 { animation: dots 1.2s infinite 0.4s; }

  .phone {
    width: 100%; max-width: 420px; height: min(640px, 90vh);
    background: #FFFDF5; border-radius: 28px; border: 3px solid #1A1A2E;
    box-shadow: 8px 8px 0 #1A1A2E; display: flex; flex-direction: column; overflow: hidden;
  }
  .header {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: #FF7A59; border-bottom: 3px solid #1A1A2E;
  }
  .name { font-family: 'Jua', sans-serif; font-size: 22px; color: #FFFDF5; line-height: 1; }
  .status { font-size: 14px; color: #FFE6DE; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7CFF6B; display: inline-block; border: 1.5px solid #1A1A2E; }
  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; width: 100%; }
  .bubble {
    max-width: 78%; padding: 10px 14px; font-size: 18px; line-height: 1.35; white-space: pre-wrap; word-break: break-word;
  }
  .bot {
    background: #FFE14D; color: #1A1A2E; border-radius: 4px 18px 18px 18px; border: 2.5px solid #1A1A2E;
  }
  .user {
    background: #1A1A2E; color: #FFFDF5; border-radius: 18px 4px 18px 18px;
  }
  .inputBar { display: flex; gap: 8px; padding: 12px; border-top: 3px solid #1A1A2E; background: #FFFDF5; }
  .input {
    flex: 1; border: 2.5px solid #1A1A2E; border-radius: 14px; padding: 10px 14px;
    font-size: 17px; font-family: 'Gaegu', sans-serif; outline: none; background: #FFFDF5; color: #1A1A2E;
  }
  .send {
    background: #FF7A59; color: #FFFDF5; border: 2.5px solid #1A1A2E; border-radius: 14px;
    padding: 0 18px; font-size: 18px; font-family: 'Jua', sans-serif; cursor: pointer;
    box-shadow: 3px 3px 0 #1A1A2E; transition: transform 0.08s;
  }
  .send:disabled { opacity: 0.5; }
  .attach { background: #FFE14D; color: #1A1A2E; border: 2.5px solid #1A1A2E; border-radius: 14px; padding: 0 14px; font-size: 22px; font-family: 'Jua', sans-serif; cursor: pointer; box-shadow: 3px 3px 0 #1A1A2E; transition: transform 0.08s; flex-shrink: 0; }
  .attach:active { transform: translateY(2px) scale(0.96); }
  .preview { display: flex; align-items: flex-start; gap: 6px; padding: 10px 12px 0; }
  .previewImg { height: 60px; border-radius: 10px; border: 2.5px solid #1A1A2E; object-fit: cover; }
  .previewX { background: #1A1A2E; color: #FFFDF5; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 11px; line-height: 1; flex-shrink: 0; }
  .sentImg { display: block; max-width: 100%; border-radius: 10px; border: 2px solid #1A1A2E; margin-bottom: 6px; }

  /* 시작 화면 — 깐죽 단계 고르기 */
  .pick { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 22px; }
  .pickTitle { font-family: 'Jua', sans-serif; font-size: 26px; color: #1A1A2E; text-align: center; line-height: 1.3; }
  .pickSub { font-size: 17px; color: #6B6B7B; text-align: center; margin-top: -8px; }
  .lvl {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 2.5px solid #1A1A2E; border-radius: 18px; padding: 12px 14px; cursor: pointer;
    background: #FFFDF5; box-shadow: 4px 4px 0 #1A1A2E; transition: transform 0.08s;
    font-family: 'Gaegu', sans-serif;
  }
  .lvl:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1A1A2E; }
  .lvlFace { font-size: 30px; flex-shrink: 0; }
  .lvlName { font-family: 'Jua', sans-serif; font-size: 19px; color: #1A1A2E; }
  .lvlDesc { font-size: 15px; color: #6B6B7B; margin-top: 2px; }
  .lvl1 { background: #E9FFE4; }
  .lvl2 { background: #FFF7C7; }
  .lvl3 { background: #FFE0D6; }
  .again {
    margin-left: auto; background: #FFFDF5; color: #1A1A2E; border: 2.5px solid #1A1A2E;
    border-radius: 12px; padding: 5px 10px; font-size: 15px; font-family: 'Gaegu', sans-serif;
    cursor: pointer; box-shadow: 2px 2px 0 #1A1A2E; flex-shrink: 0;
  }
  .again:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1A1A2E; }
  .hdrBtns { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .hdrBtns .again { margin-left: 0; }

  /* 단계별 헤더 색 */
  .header.lv1 { background: #5DC98A; }
  .header.lv2 { background: #FF7A59; }
  .header.lv3 { background: #E8453C; }
  .faceWrap { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
  .lvlBadge { position: absolute; right: -8px; bottom: -6px; font-size: 16px; line-height: 1; filter: drop-shadow(1px 1px 0 #1A1A2E); }

  /* 실패한 답변 + 다시 보내기 */
  .bubble.err { background: #FFD6D6; }
  .retry {
    display: block; margin-top: 6px; background: #1A1A2E; color: #FFFDF5; border: none;
    border-radius: 10px; padding: 4px 10px; font-size: 15px; font-family: 'Gaegu', sans-serif; cursor: pointer;
  }
  .cursor { display: inline-block; width: 2px; height: 1em; background: #1A1A2E; vertical-align: -2px; margin-left: 1px; animation: dots 0.8s infinite; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #1A1A2E; color: #FFFDF5; padding: 8px 16px; border-radius: 12px; font-size: 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  /* 대화 목록 화면 */
  .listHead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: #FFE14D; border-bottom: 3px solid #1A1A2E; }
  .listTitle { font-family: 'Jua', sans-serif; font-size: 22px; color: #1A1A2E; flex: 1; }
  .newBtn {
    background: #FF7A59; color: #FFFDF5; border: 2.5px solid #1A1A2E; border-radius: 12px;
    padding: 5px 12px; font-size: 16px; font-family: 'Jua', sans-serif; cursor: pointer; box-shadow: 2px 2px 0 #1A1A2E;
  }
  .newBtn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1A1A2E; }
  .listBody { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .chatRow {
    display: flex; align-items: center; gap: 10px; border: 2.5px solid #1A1A2E; border-radius: 16px;
    padding: 10px 12px; background: #FFFDF5; box-shadow: 3px 3px 0 #1A1A2E; cursor: pointer;
  }
  .chatRow:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1A1A2E; }
  .chatRow.lv1 { background: #E9FFE4; }
  .chatRow.lv2 { background: #FFF7C7; }
  .chatRow.lv3 { background: #FFE0D6; }
  .chatFace { font-size: 26px; flex-shrink: 0; }
  .chatInfo { flex: 1; min-width: 0; }
  .chatTitle { font-family: 'Jua', sans-serif; font-size: 17px; color: #1A1A2E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatPrev { font-size: 14px; color: #6B6B7B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .chatDate { font-size: 13px; color: #6B6B7B; flex-shrink: 0; align-self: flex-start; }
  .chatDel { background: none; border: none; font-size: 18px; cursor: pointer; color: #1A1A2E; padding: 4px 6px; flex-shrink: 0; line-height: 1; }
  .empty { text-align: center; color: #6B6B7B; font-size: 17px; margin-top: 40px; line-height: 1.6; }
  .pickBack { background: none; border: none; color: #6B6B7B; font-size: 16px; font-family: 'Gaegu', sans-serif; cursor: pointer; text-decoration: underline; margin-top: 4px; }
  .who { font-size: 14px; color: #6B6B7B; margin-top: 2px; cursor: pointer; }
  .who:empty { display: none; }

  /* 로그인 / 회원가입 화면 */
  .auth { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 22px; }
  .tabs { display: flex; border: 2.5px solid #1A1A2E; border-radius: 14px; overflow: hidden; margin-bottom: 4px; }
  .tab { flex: 1; background: #FFFDF5; border: none; padding: 9px; font-size: 18px; font-family: 'Jua', sans-serif; color: #6B6B7B; cursor: pointer; }
  .tab.active { background: #FFE14D; color: #1A1A2E; }
  .auth .input { width: 100%; }
  .auth .send { padding: 10px; font-size: 19px; }
  .googleBtn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: #FFFDF5; border: 2.5px solid #1A1A2E; border-radius: 14px; padding: 9px; cursor: pointer;
    font-size: 17px; font-family: 'Jua', sans-serif; color: #1A1A2E; box-shadow: 3px 3px 0 #1A1A2E;
  }
  .googleBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1A1A2E; }
  .authMsg { min-height: 22px; text-align: center; font-size: 16px; color: #D7263D; white-space: pre-line; }
  .authMsg.ok { color: #2E8B57; }
  .orLine { text-align: center; color: #6B6B7B; font-size: 14px; }
</style>
</head>
<body>
  <!-- 로그인 / 회원가입 화면 -->
  <div class="phone" id="authScreen" style="display:none;">
    <div class="auth">
      <div class="pickTitle">깐죽이</div>
      <div class="pickSub" id="authSub">로그인하면 대화가 계정에 저장돼</div>

      <div class="tabs" id="authTabs">
        <button class="tab active" data-mode="login">로그인</button>
        <button class="tab" data-mode="signup">회원가입</button>
      </div>

      <input class="input" id="authNick" placeholder="닉네임 (깐죽이가 부를 이름)" maxlength="20" style="display:none;" autocomplete="nickname" />
      <input class="input" id="authId" placeholder="닉네임 또는 이메일" autocomplete="username" />
      <input class="input" id="authPw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" />
      <button class="send jb-send" id="authSubmit">로그인</button>

      <div class="orLine" id="authOr">또는</div>
      <button class="googleBtn" id="authGoogle">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.5 13.3l7.9 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.7-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.7-4.1-13.6-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        구글로 계속하기
      </button>

      <div class="authMsg" id="authMsg"></div>
      <button class="pickBack" id="authSkip">로그인 없이 그냥 쓰기</button>
    </div>
  </div>

  <!-- 시작 화면: 깐죽 단계 고르기 -->
  <div class="phone" id="pickScreen">
    <div class="pick">
      <div class="pickTitle">깐죽 단계를 골라봐</div>
      <div class="pickSub">얼마나 까불지 네가 정하는 거야</div>

      <button class="lvl lvl1" data-level="1">
        <span class="lvlFace">🙂</span>
        <span>
          <span class="lvlName">1단계 · 살짝 깐죽</span>
          <div class="lvlDesc">거의 착함. 가끔 한 번씩만 툭 놀림</div>
        </span>
      </button>

      <button class="lvl lvl2" data-level="2">
        <span class="lvlFace">😏</span>
        <span>
          <span class="lvlName">2단계 · 적당히 깐죽</span>
          <div class="lvlDesc">기본 깐죽이. 한 번 약올리고 답해줌</div>
        </span>
      </button>

      <button class="lvl lvl3" data-level="3">
        <span class="lvlFace">😈</span>
        <span>
          <span class="lvlName">3단계 · 풀파워 깐죽</span>
          <div class="lvlDesc">각오해라. 매번 깐죽대고 능청 최대치</div>
        </span>
      </button>

      <button class="pickBack" id="pickBack" style="display:none;">← 이전 대화 보기</button>
    </div>
  </div>

  <!-- 대화 목록 화면 -->
  <div class="phone" id="listScreen" style="display:none;">
    <div class="listHead">
      <div style="flex:1; min-width:0;">
        <div class="listTitle">대화 목록</div>
        <div class="who" id="who" title="이름 바꾸기"></div>
      </div>
      <button class="again" id="acct">로그인</button>
      <button class="newBtn" id="newChat">＋ 새 대화</button>
    </div>
    <div class="listBody" id="listBody"></div>
  </div>

  <!-- 채팅 화면 -->
  <div class="phone" id="chatScreen" style="display:none;">
    <div class="header lv2" id="header">
      <div class="faceWrap"><span class="lvlBadge" id="lvlBadge">😏</span>
      <div class="jb-face" style="width:40px;height:40px;flex-shrink:0;">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <rect x="2.5" y="2.5" width="35" height="35" rx="10" fill="#FFE14D" stroke="#1A1A2E" stroke-width="2.5" />
          <circle class="jb-eye" cx="15" cy="18" r="2.4" fill="#1A1A2E" />
          <path d="M22 19 Q25.5 15 29 19" stroke="#1A1A2E" stroke-width="2.4" fill="none" stroke-linecap="round" />
          <path d="M14 25 Q20 31 28 23" stroke="#1A1A2E" stroke-width="2.4" fill="none" stroke-linecap="round" />
          <circle cx="12" cy="24" r="2" fill="#FF5A3C" opacity="0.5" />
          <circle cx="30" cy="23" r="2" fill="#FF5A3C" opacity="0.5" />
        </svg>
      </div>
      </div>
      <div>
        <div class="name">깐죽이</div>
        <div class="status"><span class="dot"></span> <span id="statusText">까불 준비 완료</span></div>
      </div>
      <div class="hdrBtns">
        <button class="again" id="toList" title="대화 목록">목록</button>
        <button class="again" id="share" title="대화 공유">공유</button>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="preview" id="preview" style="display:none;">
      <img class="previewImg" id="previewImg" alt="첨부" />
      <button class="previewX" id="previewX">✕</button>
    </div>

    <div class="inputBar">
      <input type="file" id="file" accept="image/*" style="display:none;" />
      <button class="attach jb-send" id="attach" title="사진 보내기">＋</button>
      <input class="input" id="input" placeholder="뭐라도 말 걸어봐..." />
      <button class="send jb-send" id="send">보내기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // 깐죽 단계별 첫인사 / 헤더 문구
  const LEVELS = {
    1: { greet: "왔구나~ 오늘은 좀 봐줄게. 편하게 말 걸어봐 :)", status: "1단계 · 살짝 깐죽", face: "🙂" },
    2: { greet: "왔어? 뭐 심심해서 왔지 ㅋㅋ 말 걸어봐, 받아줄게.", status: "2단계 · 적당히 깐죽", face: "😏" },
    3: { greet: "오~ 겁도 없이 3단계를 눌렀네? 각오해라 진짜 ㅋㅋㅋ", status: "3단계 · 풀파워 깐죽", face: "😈" },
  };

  // 가만히 있으면 깐죽이가 먼저 던지는 말 (API 안 쓰고 화면에서만)
  const NUDGES = [
    "야 뭐해 ㅋㅋ 자냐?",
    "...아직 거기 있어? 손가락 굳었어?",
    "나 심심한데 말 좀 걸어봐.",
    "생각 오래 하네. 두괄식으로 말해 두괄식으로.",
    "어? 도망갔나? 겁먹었구나 ㅋㅋ",
  ];
  const NUDGE_MS = 45 * 1000; // 45초 동안 아무것도 안 하면
  const MAX_HISTORY = 20;      // 서버로 보낼 최근 대화 개수
  const MAX_CHATS = 30;        // 저장해 두는 대화 개수
  const MAX_SAVED_MSGS = 200;  // 대화 하나당 저장하는 메시지 개수
  const STORE_KEY = "kkanjuki.v2";
  const OLD_KEY = "kkanjuki.v1"; // 예전 버전(대화 하나만 저장) — 처음 한 번 옮겨옴

  let level = 2; // 시작 화면에서 고른 깐죽 단계
  // 대화 기록 (AI는 기억이 없어서 매번 전체를 같이 보냄)
  let messages = [];
  let loading = false;
  let image = null; // { dataUrl, mediaType, base64 }
  let nudgeTimer = null;
  let nudged = false; // 한 번 말 걸었으면 사용자가 뭔가 하기 전까진 또 안 함

  // 저장된 대화들: [{ id, level, createdAt, updatedAt, messages }] (최근 것이 앞)
  let chats = [];
  let currentId = null; // 지금 열려 있는 대화 (목록/시작 화면에선 null)

  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // 사진은 용량이 커서 저장 안 하고 "📷 사진" 표시만 남김
  function slimMessages(list) {
    return list.slice(-MAX_SAVED_MSGS).map((m) => ({
      role: m.role,
      content: m.image ? ("📷 사진" + (m.content ? " · " + m.content : "")) : m.content,
      error: m.error || false,
    }));
  }

  // ===== 계정 (Supabase) — config.js 가 비어 있으면 cloud 는 null 이고 이 기기에만 저장 =====
  const CFG = window.KKANJUKI_CONFIG || {};
  const cloud = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
    ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey)
    : null;
  let user = null;              // { id, nickname } — 로그인 안 했으면 null
  const GUEST_KEY = "kkanjuki.guest"; // "로그인 없이 그냥 쓰기"를 골랐던 기억
  let syncTimer = null;         // 서버 저장은 조금 모았다가 한 번에
  let signingIn = false;

  // 로그인한 사람은 계정별로, 손님은 공용 키에 저장
  function storeKey() { return user ? "kkanjuki.u." + user.id : STORE_KEY; }

  function persist() {
    try {
      localStorage.setItem(storeKey(), JSON.stringify({ current: currentId, chats: chats }));
    } catch (e) { /* 사생활 모드 등에서 저장 불가 — 그냥 넘어감 */ }
  }

  // 지금 열린 대화를 목록에 반영하고 저장 (로그인 상태면 서버에도)
  function save() {
    const chat = chats.find((c) => c.id === currentId);
    if (!chat) return;
    chat.level = level;
    chat.messages = slimMessages(messages);
    chat.updatedAt = Date.now();
    // 방금 쓴 대화를 맨 앞으로
    chats = [chat].concat(chats.filter((c) => c.id !== chat.id)).slice(0, MAX_CHATS);
    persist();
    if (cloud && user) {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => cloudUpsert(chat), 600);
    }
  }

  function parseStore(raw) {
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.chats)) return null;
    return {
      chats: d.chats.filter((c) => c && c.id && LEVELS[c.level] && Array.isArray(c.messages)),
      current: d.current,
    };
  }

  function loadStore() {
    chats = []; currentId = null;
    try {
      const raw = localStorage.getItem(storeKey());
      if (raw) {
        const d = parseStore(raw);
        if (d) {
          chats = d.chats;
          currentId = chats.some((c) => c.id === d.current) ? d.current : null;
          return;
        }
      }
      if (user) return;
      // (손님만) 예전 저장본이 있으면 대화 하나짜리 목록으로 옮김
      const old = localStorage.getItem(OLD_KEY);
      if (old) {
        const o = JSON.parse(old);
        if (o && LEVELS[o.level] && Array.isArray(o.messages) && o.messages.length) {
          const id = newId();
          chats = [{ id: id, level: o.level, createdAt: Date.now(), updatedAt: Date.now(), messages: o.messages }];
          currentId = id;
          persist();
        }
        localStorage.removeItem(OLD_KEY);
      }
    } catch (e) { chats = []; currentId = null; }
  }

  // ---- 서버(Supabase) 읽고 쓰기 ----
  async function cloudLoadChats() {
    const { data, error } = await cloud
      .from("chats").select("id, level, messages, created_at, updated_at")
      .order("updated_at", { ascending: false }).limit(MAX_CHATS);
    if (error) throw error;
    return data.map((r) => ({
      id: r.id, level: r.level, messages: r.messages || [],
      createdAt: Date.parse(r.created_at), updatedAt: Date.parse(r.updated_at),
    }));
  }
  function cloudUpsert(chat) {
    if (!cloud || !user) return;
    cloud.from("chats").upsert({
      id: chat.id, user_id: user.id, level: chat.level, messages: chat.messages,
      created_at: new Date(chat.createdAt).toISOString(), updated_at: new Date(chat.updatedAt).toISOString(),
    }).then(({ error }) => {
      if (error) { console.error("[깐죽이] 서버 저장 실패:", error); toast("서버 저장이 안 됐어 ㅠ"); }
    });
  }
  function cloudDelete(id) {
    if (!cloud || !user) return;
    cloud.from("chats").delete().eq("id", id).then(({ error }) => {
      if (error) console.error("[깐죽이] 서버 삭제 실패:", error);
    });
  }
  // 화면을 닫거나 숨기면 모아둔 저장을 바로 보낸다
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && syncTimer) {
      clearTimeout(syncTimer); syncTimer = null;
      const chat = chats.find((c) => c.id === currentId);
      if (chat) cloudUpsert(chat);
    }
  });

  function chatTitle(chat) {
    const first = chat.messages.find((m) => m.role === "user" && m.content);
    return first ? first.content : "아직 말 안 건 대화";
  }
  function chatPreview(chat) {
    const last = chat.messages[chat.messages.length - 1];
    if (!last) return "";
    return (last.role === "user" ? "나: " : "깐죽이: ") + (last.content || "");
  }
  function fmtDate(ts) {
    const d = new Date(ts), now = new Date();
    const pad = (n) => (n < 10 ? "0" + n : "" + n);
    if (d.toDateString() === now.toDateString()) return pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + "/" + d.getDate();
    return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
  }

  function toast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 1600);
  }

  // 깐죽이가 먼저 말 걸기 타이머
  function resetNudge() {
    clearTimeout(nudgeTimer);
    nudged = false;
    nudgeTimer = setTimeout(() => {
      if (loading || nudged || chatScreenEl.style.display === "none" || document.hidden) return;
      nudged = true;
      messages.push({ role: "assistant", content: NUDGES[Math.floor(Math.random() * NUDGES.length)] });
      save();
      render();
    }, NUDGE_MS);
  }

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const fileEl = document.getElementById("file");
  const attachEl = document.getElementById("attach");
  const previewEl = document.getElementById("preview");
  const previewImgEl = document.getElementById("previewImg");
  const previewXEl = document.getElementById("previewX");
  const pickScreenEl = document.getElementById("pickScreen");
  const chatScreenEl = document.getElementById("chatScreen");
  const statusTextEl = document.getElementById("statusText");

  const headerEl = document.getElementById("header");
  const lvlBadgeEl = document.getElementById("lvlBadge");
  const shareEl = document.getElementById("share");
  const toListEl = document.getElementById("toList");
  const listScreenEl = document.getElementById("listScreen");
  const listBodyEl = document.getElementById("listBody");
  const newChatEl = document.getElementById("newChat");
  const pickBackEl = document.getElementById("pickBack");
  const authScreenEl = document.getElementById("authScreen");
  const authSubEl = document.getElementById("authSub");
  const authTabsEl = document.getElementById("authTabs");
  const authNickEl = document.getElementById("authNick");
  const authIdEl = document.getElementById("authId");
  const authPwEl = document.getElementById("authPw");
  const authSubmitEl = document.getElementById("authSubmit");
  const authOrEl = document.getElementById("authOr");
  const authGoogleEl = document.getElementById("authGoogle");
  const authMsgEl = document.getElementById("authMsg");
  const authSkipEl = document.getElementById("authSkip");
  const whoEl = document.getElementById("who");
  const acctEl = document.getElementById("acct");

  function applyLevelLook(n) {
    statusTextEl.textContent = LEVELS[n].status;
    headerEl.className = "header lv" + n;
    lvlBadgeEl.textContent = LEVELS[n].face;
  }

  // 세 화면(시작/목록/채팅) 중 하나만 보여준다
  function showScreen(which) {
    authScreenEl.style.display = which === "auth" ? "flex" : "none";
    pickScreenEl.style.display = which === "pick" ? "flex" : "none";
    listScreenEl.style.display = which === "list" ? "flex" : "none";
    chatScreenEl.style.display = which === "chat" ? "flex" : "none";
    if (which !== "chat") clearTimeout(nudgeTimer);
  }

  // 저장된 상태에 맞는 화면으로: 보던 대화 → 목록 → 단계 고르기
  function route() {
    if (currentId) openChat(currentId);
    else if (chats.length) showList();
    else showPick();
  }

  function showChat() {
    showScreen("chat");
    renderPreview();
    render();
    resetNudge();
    inputEl.focus();
  }

  // 단계를 고르면 새 대화를 만들고 채팅 화면으로
  function startChat(n) {
    level = n;
    const greet = LEVELS[n].greet;
    messages = [{ role: "assistant", content: user && user.nickname ? user.nickname + "! " + greet : greet }];
    image = null;
    loading = false;
    currentId = newId();
    chats.unshift({ id: currentId, level: n, createdAt: Date.now(), updatedAt: Date.now(), messages: [] });
    applyLevelLook(n);
    save();
    showChat();
  }

  // 저장된 대화를 열어서 이어가기
  function openChat(id) {
    const chat = chats.find((c) => c.id === id);
    if (!chat) return;
    currentId = id;
    level = chat.level;
    messages = chat.messages.map((m) => ({ role: m.role, content: m.content, error: m.error || false }));
    image = null;
    loading = false;
    applyLevelLook(level);
    persist();
    showChat();
  }

  function deleteChat(id) {
    if (!confirm("이 대화를 지울까?")) return;
    chats = chats.filter((c) => c.id !== id);
    if (currentId === id) currentId = null;
    persist();
    cloudDelete(id);
    renderList();
  }

  // 대화 목록 화면
  function showList() {
    currentId = null;
    persist();
    renderList();
    renderAccount();
    showScreen("list");
  }

  // 목록 위쪽 계정 표시: 로그인했으면 이름 + 나가기, 아니면 로그인 버튼
  function renderAccount() {
    if (!cloud) { whoEl.textContent = ""; acctEl.style.display = "none"; return; }
    acctEl.style.display = "";
    if (user) {
      whoEl.textContent = "🙂 " + (user.nickname || "이름 없음") + " ✎";
      acctEl.textContent = "나가기";
    } else {
      whoEl.textContent = "손님으로 쓰는 중 (이 기기에만 저장돼)";
      acctEl.textContent = "로그인";
    }
  }

  function renderList() {
    listBodyEl.innerHTML = "";
    if (chats.length === 0) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "아직 대화가 없어.\n위에 '＋ 새 대화' 눌러봐!";
      e.style.whiteSpace = "pre-line";
      listBodyEl.appendChild(e);
      return;
    }
    chats.forEach((chat) => {
      const row = document.createElement("div");
      row.className = "chatRow lv" + chat.level;
      row.innerHTML =
        '<span class="chatFace"></span>' +
        '<div class="chatInfo"><div class="chatTitle"></div><div class="chatPrev"></div></div>' +
        '<span class="chatDate"></span>' +
        '<button class="chatDel" title="지우기">✕</button>';
      row.querySelector(".chatFace").textContent = LEVELS[chat.level].face;
      row.querySelector(".chatTitle").textContent = chatTitle(chat);
      row.querySelector(".chatPrev").textContent = chatPreview(chat);
      row.querySelector(".chatDate").textContent = fmtDate(chat.updatedAt || chat.createdAt);
      row.querySelector(".chatDel").addEventListener("click", (e) => { e.stopPropagation(); deleteChat(chat.id); });
      row.addEventListener("click", () => openChat(chat.id));
      listBodyEl.appendChild(row);
    });
  }

  // 단계 고르는 화면 (새 대화 시작)
  function showPick() {
    currentId = null;
    persist();
    pickBackEl.style.display = chats.length ? "block" : "none";
    showScreen("pick");
  }

  // ===== 로그인 / 회원가입 =====
  let authMode = "login"; // login | signup | nick(이름만 정하기)

  function authMsg(text, ok) {
    authMsgEl.textContent = text || "";
    authMsgEl.className = "authMsg" + (ok ? " ok" : "");
  }

  function setAuthMode(mode) {
    authMode = mode;
    authMsg("");
    authTabsEl.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.mode === mode));
    const nickOnly = mode === "nick";
    authTabsEl.style.display = nickOnly ? "none" : "flex";
    authIdEl.style.display = nickOnly ? "none" : "";
    authPwEl.style.display = nickOnly ? "none" : "";
    authOrEl.style.display = nickOnly ? "none" : "";
    authGoogleEl.style.display = nickOnly ? "none" : "";
    authSkipEl.style.display = nickOnly ? "none" : "";
    authNickEl.style.display = mode === "login" ? "none" : "";
    if (mode === "login") {
      authSubEl.textContent = "로그인하면 대화가 계정에 저장돼";
      authIdEl.placeholder = "닉네임 또는 이메일";
      authPwEl.autocomplete = "current-password";
      authSubmitEl.textContent = "로그인";
    } else if (mode === "signup") {
      authSubEl.textContent = "닉네임만 있어도 가입돼. 이메일은 선택!";
      authIdEl.placeholder = "이메일 (없으면 비워도 돼)";
      authPwEl.autocomplete = "new-password";
      authSubmitEl.textContent = "가입하기";
    } else {
      authSubEl.textContent = "깐죽이가 널 뭐라고 부를까?";
      authNickEl.value = user && user.nickname ? user.nickname : "";
      authSubmitEl.textContent = "이걸로 할게";
    }
  }

  function showAuth(mode) {
    setAuthMode(mode || "login");
    showScreen("auth");
    (mode === "nick" ? authNickEl : authIdEl).focus();
  }

  // 닉네임만으로 가입할 땐 닉네임을 이메일 모양으로 바꿔서 Supabase에 넘긴다 (한글도 되게 16진수로)
  function nickToEmail(nick) {
    const bytes = new TextEncoder().encode(nick.trim().toLowerCase());
    const hex = Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
    return "n" + hex + "@nick.kkanjuki.app";
  }
  function idToEmail(v) {
    v = v.trim();
    return v.indexOf("@") >= 0 ? v.toLowerCase() : nickToEmail(v);
  }

  function friendlyAuthError(e) {
    const m = (e && e.message) || String(e);
    if (/invalid login credentials/i.test(m)) return "아이디나 비밀번호가 틀렸어";
    if (/already registered|already exists/i.test(m)) return "이미 있는 닉네임(이메일)이야";
    if (/password should be/i.test(m)) return "비밀번호는 6자 이상!";
    if (/rate limit|too many/i.test(m)) return "너무 빨리 눌렀어. 잠깐 쉬었다 해";
    if (/email not confirmed/i.test(m)) return "이메일로 보낸 확인 링크를 먼저 눌러줘";
    if (/invalid email|unable to validate email/i.test(m)) return "이메일 모양이 이상해";
    if (/failed to fetch|network/i.test(m)) return "서버에 연결이 안 돼. 인터넷 확인해봐";
    return "안 됐어: " + m;
  }

  async function fetchNickname(uid, meta) {
    const { data } = await cloud.from("profiles").select("nickname").eq("id", uid).maybeSingle();
    if (data && data.nickname) return data.nickname;
    // 프로필이 아직 없으면 가입 때 적은 이름(또는 구글 이름)으로 만든다
    const nick = (meta && (meta.nickname || meta.full_name || meta.name)) || "";
    if (nick) await cloud.from("profiles").upsert({ id: uid, nickname: nick });
    return nick;
  }

  // 로그인이 되면: 프로필 → 서버 대화 불러오기 → 손님 대화 있으면 계정으로 옮기기
  async function onSignedIn(session) {
    if (signingIn || (user && user.id === session.user.id)) return;
    signingIn = true;
    try {
      let nick = "";
      try { nick = await fetchNickname(session.user.id, session.user.user_metadata); }
      catch (e) { console.error("[깐죽이] 프로필 실패:", e); }
      user = { id: session.user.id, nickname: nick };
      try { localStorage.removeItem(GUEST_KEY); } catch (e) {}

      // 손님으로 쓰던 대화
      let guest = null;
      try { const raw = localStorage.getItem(STORE_KEY); if (raw) guest = parseStore(raw); } catch (e) {}

      loadStore(); // 이 계정의 캐시
      try {
        chats = await cloudLoadChats();
        currentId = chats.some((c) => c.id === currentId) ? currentId : null;
      } catch (e) {
        console.error("[깐죽이] 서버에서 대화 불러오기 실패:", e);
        toast("서버에서 대화를 못 가져왔어. 저장된 것만 보여줄게");
      }

      if (guest && guest.chats.length) {
        const moved = guest.chats.filter((g) => !chats.some((c) => c.id === g.id));
        moved.forEach((g) => { chats.push(g); cloudUpsert(g); });
        chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        chats = chats.slice(0, MAX_CHATS);
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        if (moved.length) toast("이전 대화 " + moved.length + "개를 계정으로 옮겼어");
      }
      persist();

      if (!user.nickname) showAuth("nick");
      else route();
    } finally {
      signingIn = false;
    }
  }

  async function submitAuth() {
    if (!cloud) return;
    const id = authIdEl.value, pw = authPwEl.value, nick = authNickEl.value.trim();
    authMsg("");
    authSubmitEl.disabled = true;
    try {
      if (authMode === "nick") {
        if (!nick) return authMsg("이름을 적어줘");
        const { error } = await cloud.from("profiles").upsert({ id: user.id, nickname: nick });
        if (error) throw error;
        user.nickname = nick;
        toast("이제 '" + nick + "'(이)라고 부를게");
        route();
      } else if (authMode === "signup") {
        if (!nick) return authMsg("닉네임을 적어줘");
        if (pw.length < 6) return authMsg("비밀번호는 6자 이상!");
        const email = id.trim() ? idToEmail(id) : nickToEmail(nick);
        const { data, error } = await cloud.auth.signUp({ email: email, password: pw, options: { data: { nickname: nick } } });
        if (error) throw error;
        if (!data.session) {
          authMsg(id.trim()
            ? "이메일로 보낸 확인 링크를 누르면 끝!"
            : "가입은 됐는데 바로 로그인이 안 돼.\nSupabase에서 '이메일 확인'을 꺼야 닉네임 가입이 돼.", !!id.trim());
        }
        // 세션이 생기면 onAuthStateChange가 이어서 처리
      } else {
        if (!id.trim() || !pw) return authMsg("아이디랑 비밀번호를 적어줘");
        const { error } = await cloud.auth.signInWithPassword({ email: idToEmail(id), password: pw });
        if (error) throw error;
      }
    } catch (e) {
      authMsg(friendlyAuthError(e));
    } finally {
      authSubmitEl.disabled = false;
    }
  }

  async function googleLogin() {
    if (!cloud) return;
    authMsg("");
    const { error } = await cloud.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) authMsg(friendlyAuthError(error));
  }

  // 로그인 없이 손님으로
  function skipAuth() {
    try { localStorage.setItem(GUEST_KEY, "1"); } catch (e) {}
    user = null;
    loadStore();
    route();
  }

  async function logout() {
    if (!confirm("로그아웃할까? 대화는 계정에 남아 있어.")) return;
    clearTimeout(syncTimer);
    const chat = chats.find((c) => c.id === currentId);
    if (chat) cloudUpsert(chat);
    try { await cloud.auth.signOut(); } catch (e) {}
    user = null; chats = []; currentId = null;
    showAuth("login");
  }

  function onAccountButton() {
    if (user) logout();
    else { try { localStorage.removeItem(GUEST_KEY); } catch (e) {} showAuth("login"); }
  }

  authTabsEl.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => setAuthMode(t.dataset.mode)));
  authSubmitEl.addEventListener("click", submitAuth);
  [authIdEl, authPwEl, authNickEl].forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); }));
  authGoogleEl.addEventListener("click", googleLogin);
  authSkipEl.addEventListener("click", skipAuth);
  acctEl.addEventListener("click", onAccountButton);
  whoEl.addEventListener("click", () => { if (user) showAuth("nick"); });

  // 대화를 글로 만들어서 공유 (공유 기능 없는 브라우저면 복사)
  async function shareChat() {
    const text = messages
      .map((m) => (m.role === "user" ? "나: " : "깐죽이: ") + (m.image ? "📷 " : "") + (m.content || ""))
      .join("\n");
    const payload = { title: "깐죽이랑 한 대화", text: text + "\n\n" + location.origin };
    try {
      if (navigator.share) { await navigator.share(payload); return; }
      await navigator.clipboard.writeText(payload.text);
      toast("대화를 복사했어!");
    } catch (e) {
      if (e && e.name === "AbortError") return; // 공유창 닫은 것
      toast("복사가 안 됐어 ㅠ");
    }
  }

  document.querySelectorAll(".lvl").forEach((btn) => {
    btn.addEventListener("click", () => startChat(Number(btn.dataset.level)));
  });
  toListEl.addEventListener("click", showList);
  newChatEl.addEventListener("click", showPick);
  pickBackEl.addEventListener("click", showList);
  shareEl.addEventListener("click", shareChat);
  inputEl.addEventListener("input", resetNudge);

  // 폰 사진은 너무 커서(수 MB) 보내기 전에 줄인다: 긴 변 1024px, JPEG
  function shrinkImage(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const MAX = 1024;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > MAX || h > MAX) {
          const r = Math.min(MAX / w, MAX / h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        resolve({ dataUrl: dataUrl, mediaType: "image/jpeg", base64: dataUrl.split(",")[1] });
      };
      img.onerror = () => {
        // 캔버스로 못 읽는 형식이면 원본 그대로
        URL.revokeObjectURL(url);
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result);
          resolve({ dataUrl: dataUrl, mediaType: file.type || "image/png", base64: dataUrl.split(",")[1] });
        };
        reader.readAsDataURL(file);
      };
      img.src = url;
    });
  }

  function renderPreview() {
    if (image) {
      previewImgEl.src = image.dataUrl;
      previewEl.style.display = "flex";
      inputEl.placeholder = "사진에 한마디 붙여봐 (선택)";
    } else {
      previewEl.style.display = "none";
      inputEl.placeholder = "뭐라도 말 걸어봐...";
    }
  }

  function render() {
    chatEl.innerHTML = "";
    messages.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = "row jb-msg";
      row.style.justifyContent = m.role === "user" ? "flex-end" : "flex-start";
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (m.role === "user" ? "user" : "bot") + (m.error ? " err" : "");
      if (m.image) {
        const img = document.createElement("img");
        img.className = "sentImg";
        img.src = m.image.dataUrl;
        bubble.appendChild(img);
      }
      if (m.content || m.streaming) {
        const span = document.createElement("span");
        span.textContent = m.content;
        span.id = "msg-" + i;
        bubble.appendChild(span);
      }
      if (m.streaming) {
        const c = document.createElement("span");
        c.className = "cursor";
        bubble.appendChild(c);
      }
      // 실패한 답변엔 "다시" 버튼 (직전 내 메시지를 다시 보냄)
      if (m.error && i === messages.length - 1 && !loading) {
        const btn = document.createElement("button");
        btn.className = "retry";
        btn.textContent = "다시 보내기";
        btn.addEventListener("click", retryLast);
        bubble.appendChild(btn);
      }
      row.appendChild(bubble);
      chatEl.appendChild(row);
    });
    if (loading && !messages.some((m) => m.streaming)) {
      const row = document.createElement("div");
      row.className = "row jb-msg";
      row.style.justifyContent = "flex-start";
      row.innerHTML = '<div class="bubble bot"><span class="jb-d1">●</span> <span class="jb-d2">●</span> <span class="jb-d3">●</span></div>';
      chatEl.appendChild(row);
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  fileEl.addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    image = await shrinkImage(file);
    renderPreview();
    resetNudge();
  });

  attachEl.addEventListener("click", () => fileEl.click());
  previewXEl.addEventListener("click", () => { image = null; renderPreview(); });

  async function send() {
    const text = inputEl.value.trim();
    if ((!text && !image) || loading) return;

    messages.push({ role: "user", content: text, image: image });
    inputEl.value = "";
    image = null;
    renderPreview();
    await ask();
  }

  // 마지막 답이 실패했을 때: 에러 말풍선 지우고 같은 질문을 다시 보냄
  async function retryLast() {
    if (loading) return;
    const last = messages[messages.length - 1];
    if (!last || !last.error) return;
    messages.pop();
    await ask();
  }

  // 지금까지의 대화를 서버에 보내고, 답을 글자 단위로 받아서 그려 넣는다
  async function ask() {
    loading = true;
    resetNudge();
    render();

    // 화면용 메시지 → API용 형식으로 변환 (사진은 image 블록으로, 실패/먼저 던진 말은 제외, 최근 것만)
    const apiMessages = messages
      .filter((m) => !m.error)
      .slice(-MAX_HISTORY)
      .map((m) => {
        if (m.image) {
          return {
            role: m.role,
            content: [
              { type: "image", source: { type: "base64", media_type: m.image.mediaType, data: m.image.base64 } },
              { type: "text", text: m.content || "이 사진 봐봐" },
            ],
          };
        }
        return { role: m.role, content: m.content };
      });

    let bot = null; // 지금 채워지고 있는 답변 말풍선
    try {
      // 키 없이 내 서버(/api/chat)만 부른다. 키는 서버가 숨기고 있음.
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: apiMessages, level: level, name: user ? user.nickname : null }),
      });

      // 에러는 JSON으로, 정상 답은 글자 스트림으로 온다
      const type = res.headers.get("content-type") || "";
      if (!res.ok || type.indexOf("application/json") >= 0) {
        let data = {};
        try { data = await res.json(); } catch (e) {}
        console.error("[깐죽이] 서버 응답:", res.status, data);
        messages.push({ role: "assistant", error: true, content: "삐빅- " + (data.error || ("서버가 " + res.status + " 를 뱉었어")) });
        return;
      }

      bot = { role: "assistant", content: "", streaming: true };
      messages.push(bot);
      render();
      const idx = messages.length - 1;

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const r = await reader.read();
        if (r.done) break;
        bot.content += decoder.decode(r.value, { stream: true });
        const span = document.getElementById("msg-" + idx);
        if (span) { span.textContent = bot.content; chatEl.scrollTop = chatEl.scrollHeight; }
      }
      bot.streaming = false;
      if (!bot.content) bot.content = "어? 할 말을 잃었네 ㅋㅋ";
      if (bot.content.indexOf("삐빅-") === 0) bot.error = true; // 서버가 스트림 도중 실패 사유를 보낸 경우
    } catch (err) {
      console.error("[깐죽이] 통신 실패:", err);
      if (bot) { bot.streaming = false; if (!bot.content) messages.pop(); }
      messages.push({ role: "assistant", error: true, content: "삐빅- 서버까지 못 갔어 (" + (err && err.message ? err.message : err) + ")" });
    } finally {
      loading = false;
      save();
      render();
      resetNudge();
    }
  }

  sendEl.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // ===== 시작 =====
  renderPreview();
  (async function boot() {
    if (!cloud) {
      // 로그인 기능이 꺼져 있으면 (config.js 비어 있음) 예전처럼 이 기기에만 저장
      loadStore();
      route();
      return;
    }
    cloud.auth.onAuthStateChange((event, session) => {
      if (session) onSignedIn(session);
      else if (event === "SIGNED_OUT" && user) { user = null; chats = []; currentId = null; showAuth("login"); }
    });
    let session = null;
    try { session = (await cloud.auth.getSession()).data.session; } catch (e) {}
    if (session) { await onSignedIn(session); return; }
    let guest = false;
    try { guest = localStorage.getItem(GUEST_KEY) === "1"; } catch (e) {}
    if (guest) skipAuth();
    else showAuth("login");
  })();
</script>
</body>
</html>
